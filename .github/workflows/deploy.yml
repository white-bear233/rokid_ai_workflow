name: CI/CD Offline Transfer Deployment (ai-workflow)

on:
  push:
    branches: [ "main" ]      # 根据你的主分支修改
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 在 GitHub 上构建镜像
      - name: Build Docker Image
        run: |
          docker build -t ai-workflow:latest .

      # 2. 将镜像保存为 tar 文件
      - name: Save Docker Image
        run: |
          docker save -o ai-workflow.tar ai-workflow:latest

      # 3. 将镜像文件和配置文件传输到服务器
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "ai-workflow.tar,docker-compose.yml"
          target: "/opt/mobile-backend/ai-workflow"
          overwrite: true
          timeout: "120s"

      # 4. 在服务器上加载镜像并重启
      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/mobile-backend/ai-workflow

            echo "Loading docker image from tar file..."
            docker load -i ai-workflow.tar

            echo "Restarting ai-workflow service..."
            # 如果服务器上命令是 docker compose，就改成 docker compose up -d
            docker-compose up -d --remove-orphans

            echo "Cleaning up..."
            rm ai-workflow.tar

            docker image prune -f